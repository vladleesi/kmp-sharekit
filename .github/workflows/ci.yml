name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate when called by the release workflow.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Check pull request target
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$BASE_BRANCH" != develop ]] && ! [[ "$BASE_BRANCH" == master && "$HEAD_BRANCH" == develop && "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            echo '::error::Contributor pull requests must target develop. Only develop may be promoted to master.'
            exit 1
          fi
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic
      - name: Check formatting, test Android, and build AAR
        run: ./gradlew ktlintCheck :sharekit:testAndroidHostTest :sharekit:bundleAndroidMainAar --stacktrace

  desktop:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic
      - name: Test and build JVM desktop library
        shell: bash
        run: ./gradlew :sharekit:jvmTest :sharekit:jvmJar --stacktrace

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic
      - name: Test JS and WasmJS in Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: ./gradlew :sharekit:jsBrowserTest :sharekit:wasmJsBrowserTest --stacktrace

  apple:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Compile and link every iOS architecture, then run simulator tests
        run: >-
          ./gradlew
          :sharekit:compileKotlinIosArm64 :sharekit:compileKotlinIosSimulatorArm64 :sharekit:compileKotlinIosX64
          :sharekit:linkDebugFrameworkIosArm64 :sharekit:linkDebugFrameworkIosSimulatorArm64
          :sharekit:linkDebugFrameworkIosX64 :sharekit:iosSimulatorArm64Test --stacktrace
      - name: Validate all Maven publications locally
        run: |
          ./gradlew :sharekit:publishAllPublicationsToValidationRepository -PsignAllPublications=false --stacktrace
          python3 .github/scripts/verify-publications.py

  promote:
    needs: [android, desktop, browser, apple]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'vladleesi/kmp-sharekit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    concurrency:
      group: promote-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fast-forward master to the verified develop commit
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin develop master
          if [[ "$GITHUB_SHA" != "$(git rev-parse origin/develop)" ]]; then
            echo 'A newer develop commit exists; its CI run will handle promotion.'
            exit 0
          fi
          git merge-base --is-ancestor origin/master "$GITHUB_SHA"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "$GITHUB_SHA:refs/heads/master"
          echo 'promoted=true' >> "$GITHUB_OUTPUT"
      - name: Start the release workflow on master
        if: steps.promote.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A newly promoted workflow can take a moment to appear in the Actions API.
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run release.yml --ref master --field sha="$GITHUB_SHA" --field confirm=true; then
              exit 0
            fi
            echo "Waiting for release workflow registration (attempt $attempt)."
            sleep 5
          done
          exit 1
