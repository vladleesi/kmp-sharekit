name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: Master commit to release; leave empty for the current master commit.
        required: false
        type: string
      confirm:
        description: Create the version tag, publish the GitHub release, and publish to Maven Central.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'vladleesi/kmp-sharekit' && github.ref == 'refs/heads/master' && (github.event_name != 'workflow_dispatch' || inputs.confirm)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.sha || github.sha }}
      - name: Verify the master commit and release version
        id: version
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          properties = dict(line.split('=', 1) for line in Path('gradle.properties').read_text().splitlines() if '=' in line)
          version = properties['VERSION_NAME']
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', version):
              raise SystemExit('A release requires a stable semantic VERSION_NAME in gradle.properties.')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'origin/master'], check=True)
          tag = f'v{version}'
          existing = subprocess.run(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{}}'], capture_output=True, text=True)
          release = existing.returncode != 0 or existing.stdout.strip() == sha
          if not release:
              print(f'{tag} already belongs to another commit. Bump VERSION_NAME to publish a new release.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\ntag={tag}\nrelease={str(release).lower()}\n')
          PY

  verify:
    needs: version
    if: needs.version.outputs.release == 'true'
    # The reused CI declares a promotion job; its branch guard skips it on master.
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  github-release:
    needs: [version, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.version.outputs.sha }}
      - name: Create the matching tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$RELEASE_TAG" -m "ShareKit $RELEASE_TAG"
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "refs/tags/$RELEASE_TAG"
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          version = os.environ['RELEASE_TAG'][1:]
          changelog = Path('CHANGELOG.md').read_text()
          section = re.search(rf'^## {re.escape(version)}\b[^\n]*\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if not section:
              raise SystemExit('The release version must have a changelog entry.')
          (Path(os.environ['RUNNER_TEMP']) / 'release-notes.md').write_text(section.group(1).strip() + '\n')
          PY
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "ShareKit $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("A stable published GitHub release is required") else . end'

  publish:
    needs: [version, github-release]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-disabled: true
      - name: Validate signed Android, iOS, JS, WasmJS, and metadata artifacts and publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          for variable in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Required publishing secret is missing: $variable"
              exit 1
            fi
          done
          ./gradlew :sharekit:publishAllPublicationsToValidationRepository --no-configuration-cache --no-daemon
          python3 .github/scripts/verify-publications.py --signed
          ./gradlew :sharekit:publishAndReleaseToMavenCentral --no-configuration-cache --no-daemon
